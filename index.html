<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Some stations (e.g. SomaFM) refuse streams requested from other sites' pages, as a player app we send no referrer -->
<meta name="referrer" content="no-referrer">
<title>Ice Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
<style>
  :root {
    --bg:#111; --glass:rgba(20,20,22,.72); --line:rgba(255,255,255,.09);
    --fg:#f2f2f2; --muted:#9a9aa0; --hover:rgba(255,255,255,.08); --accent:#7cc4ff; --star:#ffd166;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); overflow:hidden;
         font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body.idle { cursor:none; }
  button { font:inherit; color:inherit; }

  /* ---- Stage: video, embed or starfield, always filling the window ---- */
  #stage { position:fixed; inset:0; overflow:hidden; background:var(--bg); }
  #stage video, #stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; }
  #stage iframe { pointer-events:none; }
  /* Starfield: one big randomly drawn sky (no tiling) as wide as the screen's diagonal, slowly rotating */
  .space { position:absolute; top:50%; left:50%; animation:spin 210s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .space { animation:none; } }
  /* Animated effects draw on one canvas that fills the stage */
  .fx { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* ---- Glass surfaces ---- */
  .glass { background:var(--glass); border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.45);
           backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4); }

  .i { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---- Dock ---- */
  .dock { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:2px;
          padding:6px; border-radius:999px; max-width:calc(100vw - 32px); transition:opacity .4s, transform .4s; }
  body.idle .dock { opacity:0; transform:translate(-50%, 16px); pointer-events:none; }
  .ib { display:grid; place-items:center; width:40px; height:40px; flex:none; border:0; border-radius:50%; background:transparent; cursor:pointer; transition:background .15s; }
  .ib:hover { background:var(--hover); }
  .ib[aria-expanded="true"] { background:rgba(255,255,255,.16); }
  .ib:disabled { opacity:.35; cursor:default; background:transparent; }
  .ib.primary { background:var(--fg); color:#111; }
  .ib.primary:hover { background:#fff; }
  .ib.busy { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  .sep { width:1px; height:24px; margin:0 4px; background:var(--line); flex:none; }
  .mini { display:flex; flex-direction:column; justify-content:center; min-width:0; width:220px; height:40px; padding:0 12px;
          border:0; border-radius:20px; background:none; text-align:left; cursor:pointer; }
  .mini:hover { background:var(--hover); }
  .mini b, .mini span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini b { font-size:13px; font-weight:600; }
  .mini span { font-size:11px; color:var(--muted); }
  @media (max-width:560px) { .mini { display:none; } }

  /* ---- Panels (one open at a time, above the dock) ---- */
  .panel { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); z-index:6; width:min(420px, calc(100vw - 32px));
           max-height:min(70vh, 580px); overflow:hidden auto; padding:16px; border-radius:18px; display:grid; grid-template-columns:minmax(0, 1fr);
           gap:12px; animation:pop .18s ease-out; }
  .panel.small { width:min(260px, calc(100vw - 32px)); }
  .panel[hidden] { display:none; }
  @keyframes pop { from { opacity:0; transform:translate(-50%, 8px) scale(.98); } }
  .panel h3 { margin:4px 0 0; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .row { display:flex; gap:6px; align-items:center; }
  .field { flex:1; min-width:0; height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:rgba(0,0,0,.35);
           color:var(--fg); font:inherit; outline:none; }
  .field:focus { border-color:var(--accent); }
  .btn { height:36px; padding:0 14px; flex:none; display:inline-flex; align-items:center; gap:6px; border:0; border-radius:10px;
         background:var(--fg); color:#111; font-weight:600; font-size:13px; cursor:pointer; }
  .btn.ghost { background:var(--hover); color:var(--fg); }
  .btn.ghost:hover { background:rgba(255,255,255,.14); }
  .btn .i { width:16px; height:16px; }
  .status { font-size:12px; color:var(--muted); min-height:1em; }
  input[type=range] { width:100%; accent-color:var(--fg); }
  .mixer { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:12px 14px; align-items:center; }
  .mixer label { font-size:13px; white-space:nowrap; }
  .mixer label.on { color:var(--accent); }
  .ib.on { position:relative; }
  .ib.on::after { content:''; position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { height:30px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:var(--hover); font-size:12px; cursor:pointer; }
  .chip:hover { background:rgba(255,255,255,.14); }
  .chip[aria-pressed="true"] { background:var(--fg); color:#111; border-color:var(--fg); font-weight:600; }

  .list { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:minmax(0, 1fr); gap:2px; }
  .list:empty::before { content:attr(data-empty); display:block; padding:4px 10px; font-size:12px; color:var(--muted); }
  .list li { display:flex; align-items:center; gap:6px; padding:4px 4px 4px 10px; border-radius:10px; }
  .list li:hover { background:var(--hover); }
  .list .main { flex:1; min-width:0; padding:4px 0; border:0; background:none; text-align:left; cursor:pointer; }
  .list .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .m { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list .ib { width:30px; height:30px; }
  .list .ib .i { width:16px; height:16px; }
  .list .x { opacity:0; }
  .list li:hover .x, .list .x:focus-visible { opacity:1; }
  @media (hover:none) { .list .x { opacity:1; } }

  .now { display:flex; gap:8px; align-items:center; }
  .now .txt { flex:1; min-width:0; }
  #npTitle { font-size:16px; font-weight:600; overflow-wrap:anywhere; }
  .star.on .i { fill:var(--star); stroke:var(--star); }

  #toast { position:fixed; left:50%; top:20px; transform:translateX(-50%); z-index:7; max-width:calc(100vw - 32px); padding:8px 16px;
           border-radius:999px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<!-- Icon set (stroke icons, 24px grid) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.48M7.76 16.24a6 6 0 0 1 0-8.48M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>

  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 12h18M3 7.5h4M3 16.5h4M17 7.5h4M17 16.5h4"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></symbol>

  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>

<div id="stage"></div>
<div id="toast" class="glass" role="status"></div>

<!-- Panels -->
<section id="panel-audio" class="panel glass" hidden aria-label="Audio stream">
  <h3>Audio stream</h3>
  <div class="row">
    <input id="audioUrl" class="field" type="url" placeholder="Icecast, Shoutcast, .pls, .m3u, HLS or DASH URL">
    <button id="audioPlay" class="btn">Play</button>
    <button id="audioSave" class="ib" title="Save to favorites"><svg class="i"><use href="#i-bookmark"/></svg></button>
  </div>
  <div id="audioStatus" class="status"></div>
  <h3>Favorite stations</h3>
  <ul id="audioFavs" class="list" data-empty="No favorites yet: enter a URL and press the bookmark"></ul>
</section>

<section id="panel-tracks" class="panel glass" hidden aria-label="Tracks">
  <div class="now">
    <div class="txt">
      <h3>Now playing</h3>
      <div id="npTitle">Nothing playing</div>
      <div id="npStation" class="status"></div>
    </div>
    <button id="npRefresh" class="ib" title="Check the track info again"><svg class="i"><use href="#i-refresh"/></svg></button>
    <button id="npSave" class="ib star" title="Save this track" disabled><svg class="i"><use href="#i-star"/></svg></button>
  </div>
  <h3>Recently played · <span id="historyCount">0</span></h3>
  <ul id="history" class="list" data-empty="Tracks you hear will show up here"></ul>
  <div class="row">
    <h3 style="flex:1">Saved tracks · <span id="savedCount">0</span></h3>
    <button id="savedDownload" class="ib" title="Download saved tracks"><svg class="i"><use href="#i-download"/></svg></button>
  </div>
  <ul id="saved" class="list" data-empty="Star a track to save it"></ul>
</section>

<section id="panel-volume" class="panel small glass" hidden aria-label="Volume">
  <h3>Volume</h3>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
</section>

<section id="panel-ambient" class="panel glass" hidden aria-label="Ambient sounds">
  <h3>Ambient sounds</h3>
  <div id="ambientMixer" class="mixer"></div>
  <div class="row">
    <div id="ambientStatus" class="status" style="flex:1"></div>
    <button id="ambientOff" class="btn ghost">All off</button>
  </div>
</section>

<section id="panel-video" class="panel glass" hidden aria-label="Background video">
  <h3>Background video</h3>
  <div class="row">
    <input id="videoUrl" class="field" type="url" placeholder="MP4, WebM, HLS, YouTube or Vimeo URL">
    <button id="videoLoad" class="btn">Load</button>
    <button id="videoSave" class="ib" title="Save to favorites"><svg class="i"><use href="#i-bookmark"/></svg></button>
  </div>
  <div id="videoStatus" class="status">Showing the starfield</div>
  <h3>Effects</h3>
  <div id="fxChips" class="chips" role="group" aria-label="Background effects"></div>
  <h3>Favorite videos</h3>
  <ul id="videoFavs" class="list" data-empty="No favorites yet: enter a URL and press the bookmark"></ul>
</section>

<!-- Dock -->
<nav class="dock glass" aria-label="Player controls">
  <button id="playToggle" class="ib primary" title="Play"><svg class="i"><use href="#i-play"/></svg></button>
  <button id="mini" class="mini" data-panel="tracks" title="Track info">
    <b id="miniTitle">Ice Player</b><span id="miniStation">Pick a station to start</span>
  </button>
  <div class="sep"></div>
  <button class="ib" data-panel="audio" title="Stations"><svg class="i"><use href="#i-radio"/></svg></button>
  <button class="ib" data-panel="tracks" title="Tracks"><svg class="i"><use href="#i-music"/></svg></button>
  <button id="volumeBtn" class="ib" data-panel="volume" title="Volume"><svg class="i"><use href="#i-volume"/></svg></button>
  <button id="ambientBtn" class="ib" data-panel="ambient" title="Ambient sounds"><svg class="i"><use href="#i-wind"/></svg></button>
  <button class="ib" data-panel="video" title="Background video"><svg class="i"><use href="#i-film"/></svg></button>
  <button id="fullscreen" class="ib" title="Full screen (F)"><svg class="i"><use href="#i-expand"/></svg></button>
</nav>

<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), stage = $('stage');
let audioEngine = null, videoEngine = null;

const setIcon = (btn, name) => btn.querySelector('use').setAttribute('href', '#i-' + name);

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}

// Remember last URLs and volume (per-browser convenience only)
for (const id of ['audioUrl', 'videoUrl', 'volume']) {
  try { const v = localStorage.getItem(id); if (v !== null) $(id).value = v; } catch {}
  $(id).addEventListener('change', e => { try { localStorage.setItem(id, e.target.value); } catch {} });
}

function kindOf(url) {
  const path = url.split(/[?#]/)[0].toLowerCase();
  if (path.endsWith('.m3u8')) return 'hls';
  if (path.endsWith('.mpd')) return 'dash';
  if (path.endsWith('.pls') || path.endsWith('.m3u')) return 'playlist';
  return 'direct';
}

// Attach any URL to a <video>/<audio> element using the right engine. Returns a destroy fn.
function attach(el, url) {
  const kind = kindOf(url);
  if (kind === 'hls' && !el.canPlayType('application/vnd.apple.mpegurl') && window.Hls?.isSupported()) {
    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(el);
    return () => hls.destroy();
  }
  if (kind === 'dash' && window.dashjs) {
    const p = dashjs.MediaPlayer().create();
    p.initialize(el, url, false);
    return () => p.reset();
  }
  el.src = url;
  return () => { el.removeAttribute('src'); el.load(); };
}

// .pls / .m3u: fetch and pull out every stream URL (stations list backup servers)
async function resolvePlaylist(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`playlist request failed (${res.status})`);
  const urls = [...(await res.text()).matchAll(/^(?:File\d+=)?(https?:\/\/\S+)/gmi)].map(m => m[1]);
  if (!urls.length) throw new Error('no stream URL found in playlist');
  // An https page can't play http streams, so upgrade them (most stations serve both)
  return location.protocol === 'https:' ? urls.map(u => u.replace(/^http:/, 'https:')) : urls;
}

// ---- Panels and dock ----
let openPanel = null;
function setPanel(name) {
  openPanel = name;
  document.querySelectorAll('.panel').forEach(p => p.hidden = p.id !== 'panel-' + name);
  document.querySelectorAll('.ib[data-panel]').forEach(b => b.setAttribute('aria-expanded', b.dataset.panel === name));
  if (name) $('panel-' + name).querySelector('.field')?.focus({ preventScroll: true });
}
document.querySelectorAll('[data-panel]').forEach(b => b.onclick = () => setPanel(openPanel === b.dataset.panel ? null : b.dataset.panel));
document.addEventListener('pointerdown', e => {
  if (openPanel && !e.target.closest('.panel, .dock')) setPanel(null);
});

// Fade the dock out after a few idle seconds (never while a panel is open)
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!openPanel) document.body.classList.add('idle'); }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
wake();

// ---- Audio ----
let connecting = false;
function updatePlayButton() {
  const playing = !!audioEngine && !audio.paused;
  setIcon($('playToggle'), playing || connecting ? 'stop' : 'play');
  $('playToggle').title = playing || connecting ? 'Stop' : 'Play';
  $('playToggle').classList.toggle('busy', connecting);
}

function stopAudio() {
  audio.pause();
  audioEngine?.(); audioEngine = null;
  stopTrackInfo();
  updatePlayButton();
}

function playStream(url) {
  stopAudio();
  audioEngine = attach(audio, url);
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timed out')), 15000));
  return Promise.race([audio.play(), timeout]);
}

async function playAudio() {
  const url = $('audioUrl').value.trim();
  if (!url) return setPanel('audio');
  stopAudio();
  connecting = true; updatePlayButton();
  $('audioStatus').textContent = 'Connecting…';
  setMini('Connecting…', url);
  try {
    const candidates = kindOf(url) === 'playlist' ? await resolvePlaylist(url) : [url];
    // Try each server in turn until one plays
    for (const [i, u] of candidates.entries()) {
      try {
        await playStream(u);
        $('audioStatus').textContent = candidates.length > 1 ? `Playing (server ${i + 1} of ${candidates.length})` : 'Playing';
        startTrackInfo(u);
        return;
      } catch (e) {
        if (i === candidates.length - 1) throw new Error(candidates.length > 1 ? `none of the ${candidates.length} servers would play` : e.message);
      }
    }
  } catch (e) {
    connecting = false;
    stopAudio();
    $('audioStatus').textContent = 'Error: ' + e.message;
    toast('Couldn’t play that stream: ' + e.message);
  } finally {
    connecting = false; updatePlayButton();
  }
}

$('audioPlay').onclick = playAudio;
$('audioUrl').onkeydown = e => { if (e.key === 'Enter') playAudio(); };
$('playToggle').onclick = () => {
  if (connecting || (audioEngine && !audio.paused)) { stopAudio(); $('audioStatus').textContent = 'Stopped'; }
  else playAudio();
};
function applyVolume() {
  audio.volume = $('volume').value;
  setIcon($('volumeBtn'), +$('volume').value === 0 ? 'mute' : 'volume');
}
$('volume').oninput = applyVolume;
applyVolume();
audio.addEventListener('playing', () => { $('audioStatus').textContent = 'Playing'; updatePlayButton(); });
audio.addEventListener('pause', updatePlayButton);
audio.addEventListener('waiting', () => $('audioStatus').textContent = 'Buffering…');
audio.addEventListener('error', () => $('audioStatus').textContent = 'Error: could not play this stream');

// ---- Ambient sounds: short seamless loops (ambient/*.m4a) mixed in over the radio ----
// Played through Web Audio so loops are gapless; each sound has its own level, separate from the radio volume.
// The fire loops are mastered quieter (their crackles need headroom), so they get a boost here.
const AMBIENT = [
  { key: 'rain',      name: 'Rain',           trim: 1 },
  { key: 'brook',     name: 'Brook',          trim: 1 },
  { key: 'crickets',  name: 'Crickets',       trim: 1 },
  { key: 'fireplace', name: 'Fireplace',      trim: 1.8 },
  { key: 'logs',      name: 'Crackling logs', trim: 1.6 },
];
let actx = null;
const amb = {};
const savedLevels = (() => { try { return JSON.parse(localStorage.getItem('ambient')) || {}; } catch { return {}; } })();

function audioCtx() {
  actx ??= new AudioContext();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

async function setAmbient(key, level) {
  const a = amb[key];
  a.level = level;
  a.slider.value = level;
  updateAmbientUI();
  if (level === 0 && !a.src) return;
  const c = audioCtx();
  if (!a.gain) { a.gain = c.createGain(); a.gain.gain.value = 0; a.gain.connect(c.destination); }
  clearTimeout(a.stopTimer);
  if (level > 0 && !a.src) {
    a.buffer ??= fetch(`ambient/${key}.m4a`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(b => c.decodeAudioData(b));
    let buf;
    try { buf = await a.buffer; } catch { a.buffer = null; toast(`Couldn’t load ${a.name}`); return setAmbient(key, 0); }
    if (a.src || a.level === 0) return;   // changed while loading
    a.src = c.createBufferSource();
    a.src.buffer = buf; a.src.loop = true;
    a.src.connect(a.gain);
    a.src.start(0, Math.random() * buf.duration);   // random start so repeats don't line up between sounds
  }
  a.gain.gain.setTargetAtTime(a.level ** 2 * a.trim, c.currentTime, 0.15);   // squared: finer control at low levels
  if (a.level === 0) a.stopTimer = setTimeout(() => { a.src?.stop(); a.src?.disconnect(); a.src = null; }, 1200);
}

function updateAmbientUI() {
  const on = AMBIENT.filter(s => amb[s.key].level > 0);
  AMBIENT.forEach(s => amb[s.key].label.classList.toggle('on', amb[s.key].level > 0));
  $('ambientBtn').classList.toggle('on', on.length > 0);
  $('ambientOff').disabled = !on.length;
  $('ambientStatus').textContent = on.length ? 'Mixing in: ' + on.map(s => s.name).join(', ') : 'Slide a sound up to mix it in';
  try { localStorage.setItem('ambient', JSON.stringify(Object.fromEntries(AMBIENT.map(s => [s.key, amb[s.key].level])))); } catch {}
}

for (const s of AMBIENT) {
  const id = 'amb-' + s.key;
  const label = Object.assign(document.createElement('label'), { htmlFor: id, textContent: s.name });
  const slider = Object.assign(document.createElement('input'), { id, type: 'range', min: 0, max: 1, step: 0.01 });
  slider.oninput = () => setAmbient(s.key, +slider.value);
  amb[s.key] = { ...s, label, slider, level: Math.min(1, Math.max(0, +savedLevels[s.key] || 0)) };
  slider.value = amb[s.key].level;
  $('ambientMixer').append(label, slider);
}
$('ambientOff').onclick = () => AMBIENT.forEach(s => setAmbient(s.key, 0));
updateAmbientUI();

// Browsers only allow sound after a click or key press, so last session's mix resumes on the first one
const resumeMix = () => AMBIENT.forEach(s => { if (amb[s.key].level > 0 && !amb[s.key].src) setAmbient(s.key, amb[s.key].level); });
addEventListener('pointerdown', resumeMix, { once: true });
addEventListener('keydown', resumeMix, { once: true });

// ---- Track info (Icecast/Shoutcast "ICY" metadata) ----
// Every 15 s, open a second short connection asking for in-stream metadata, read up to the
// first title block, then hang up. Costs a few KB per check instead of a second full stream.
const TRACK_POLL_MS = 15000;
let trackUrl = null, trackTimer = null, trackBusy = false, nowTrack = null;

function setMini(title, station) {
  $('miniTitle').textContent = title;
  $('miniStation').textContent = station;
}
function setNow(title, station = $('npStation').textContent) {
  $('npTitle').textContent = title;
  $('npStation').textContent = station;
  setMini(title, station);
}

function decodeMeta(bytes) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch { return new TextDecoder('windows-1252').decode(bytes); }  // older servers send Latin-1
}

async function fetchIcyInfo(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TRACK_POLL_MS);
  try {
    const res = await fetch(url, { headers: { 'Icy-MetaData': '1' }, signal: ctrl.signal, cache: 'no-store' });
    const station = res.headers.get('icy-name') || '';
    const metaint = parseInt(res.headers.get('icy-metaint'), 10);
    if (!metaint) return { station, title: '' };
    const reader = res.body.getReader();
    let buf = new Uint8Array(0);
    const need = async n => {
      while (buf.length < n) {
        const { done, value } = await reader.read();
        if (done) throw new Error('stream ended');
        const merged = new Uint8Array(buf.length + value.length);
        merged.set(buf); merged.set(value, buf.length);
        buf = merged;
      }
    };
    // Each block is metaint audio bytes, one length byte (x16), then the metadata text.
    // A block can be empty, so look at a few before giving up.
    for (let block = 0; block < 3; block++) {
      await need(metaint + 1);
      const end = metaint + 1 + buf[metaint] * 16;
      await need(end);
      const title = decodeMeta(buf.subarray(metaint + 1, end)).match(/StreamTitle='(.*?)';/)?.[1].trim();
      if (title) return { station, title };
      buf = buf.slice(end);
    }
    return { station, title: '' };
  } finally {
    clearTimeout(timer);
    ctrl.abort();
  }
}

function startTrackInfo(url) {
  stopTrackInfo();
  trackUrl = url;
  if (kindOf(url) !== 'direct') {
    setNow('Track info isn’t available for this kind of stream', 'Playing');
    return;
  }
  setNow('Getting track info…', 'Playing');
  refreshTrackInfo();
  trackTimer = setInterval(refreshTrackInfo, TRACK_POLL_MS);
}

function stopTrackInfo() {
  clearInterval(trackTimer);
  trackTimer = null; trackUrl = null; nowTrack = null;
  $('npTitle').textContent = 'Nothing playing';
  $('npStation').textContent = '';
  if (!connecting) setMini('Ice Player', 'Pick a station to start');
  updateSaveButton();
}

async function refreshTrackInfo() {
  const url = trackUrl;
  if (!url || trackBusy || kindOf(url) !== 'direct') return;
  trackBusy = true;
  try {
    const { station, title } = await fetchIcyInfo(url);
    if (url !== trackUrl) return;  // the user switched streams meanwhile
    if (!title) {
      if (!nowTrack) setNow('This station doesn’t send track info', station);
      return;
    }
    if (title !== nowTrack?.title) {
      nowTrack = { title, station, at: Date.now() };
      setNow(title, station);
      addToHistory(nowTrack);
      updateSaveButton();
    }
  } catch {
    if (url === trackUrl && !nowTrack) setNow('Couldn’t get track info from this station');
  } finally {
    trackBusy = false;
  }
}

// ---- Recently played (last 10) and saved tracks, stored in this browser ----
const HISTORY_MAX = 10;
const loadList = key => { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } };
const storeList = (key, list) => { try { localStorage.setItem(key, JSON.stringify(list)); } catch {} };
const sameTrack = (a, b) => a.title === b.title && a.station === b.station;
const isSaved = t => loadList('tracks-saved').some(s => sameTrack(s, t));

function addToHistory(track) {
  const history = loadList('tracks-history');
  if (history[0] && sameTrack(history[0], track)) return;
  storeList('tracks-history', [track, ...history].slice(0, HISTORY_MAX));
  renderTracks();
}

function saveTrack(track) {
  if (isSaved(track)) return;
  storeList('tracks-saved', [{ ...track, savedAt: Date.now() }, ...loadList('tracks-saved')]);
  renderTracks();
}

function removeSaved(track) {
  storeList('tracks-saved', loadList('tracks-saved').filter(s => !sameTrack(s, track)));
  renderTracks();
}

function updateSaveButton() {
  const saved = !!nowTrack && isSaved(nowTrack);
  $('npSave').disabled = !nowTrack || saved;
  $('npSave').classList.toggle('on', saved);
  $('npSave').title = saved ? 'Saved' : 'Save this track';
}

const when = ms => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function iconButton(icon, title, onclick, extra = '') {
  const b = Object.assign(document.createElement('button'), { className: 'ib ' + extra, title, onclick });
  b.innerHTML = `<svg class="i"><use href="#i-${icon}"/></svg>`;
  return b;
}

// One list row: a main area (text, optionally clickable) plus trailing buttons
function listItem(title, meta, onclick, ...buttons) {
  const li = document.createElement('li');
  const main = document.createElement(onclick ? 'button' : 'div');
  main.className = 'main';
  if (onclick) main.onclick = onclick;
  main.title = title;
  main.append(Object.assign(document.createElement('div'), { className: 't', textContent: title }));
  if (meta) main.append(Object.assign(document.createElement('div'), { className: 'm', textContent: meta }));
  li.append(main, ...buttons);
  return li;
}

function renderTracks() {
  const history = loadList('tracks-history'), saved = loadList('tracks-saved');
  const meta = t => [t.station, when(t.at)].filter(Boolean).join(' · ');
  $('historyCount').textContent = history.length;
  $('savedCount').textContent = saved.length;
  $('history').replaceChildren(...history.map(t => {
    const star = iconButton('star', isSaved(t) ? 'Saved' : 'Save this track', () => saveTrack(t), 'star' + (isSaved(t) ? ' on' : ''));
    star.disabled = isSaved(t);
    return listItem(t.title, meta(t), null, star);
  }));
  $('saved').replaceChildren(...saved.map(t => listItem(t.title, meta(t), null, iconButton('x', 'Remove', () => removeSaved(t), 'x'))));
  $('savedDownload').hidden = !saved.length;
  updateSaveButton();
}

$('npSave').onclick = () => nowTrack && saveTrack(nowTrack);
$('npRefresh').onclick = refreshTrackInfo;
$('savedDownload').onclick = () => {
  const text = loadList('tracks-saved').map(t => `${t.title}\t${t.station}\t${new Date(t.at).toLocaleString()}`).join('\n');
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([`Track\tStation\tHeard\n${text}\n`], { type: 'text/plain' })),
    download: 'saved-tracks.txt',
  });
  a.click();
  URL.revokeObjectURL(a.href);
};
renderTracks();

// ---- Starfield (shown whenever no video is loaded) ----
// A fresh random sky is drawn on every page load: one canvas as wide as the screen's diagonal,
// so it covers the window at every angle while it turns once every 210 s, with no repeating tile.
// Most stars are faint pinpoints, a few are bright with a soft glow, colors run from blue-white to
// warm, and a faint diagonal band of extra dim stars hints at the Milky Way.
let skyCanvas = null;

function skySize() {
  const w = Math.max(screen.width, innerWidth), h = Math.max(screen.height, innerHeight);
  return Math.ceil(Math.hypot(w, h)) + 4;
}

function drawSky(size) {
  const scale = Math.min(devicePixelRatio || 1, 4096 / size);   // keep the bitmap a sane size
  const c = document.createElement('canvas');
  c.className = 'space';
  c.width = c.height = Math.round(size * scale);
  Object.assign(c.style, { width: size + 'px', height: size + 'px', margin: `${-size / 2}px 0 0 ${-size / 2}px` });
  const g = c.getContext('2d');
  g.scale(scale, scale);
  g.fillStyle = '#0b0b0f';
  g.fillRect(0, 0, size, size);

  const R = Math.random;
  const tints = ['255,255,255', '255,255,255', '255,255,255', '200,220,255', '170,200,255', '255,240,215', '255,214,170'];
  const star = (x, y, r, a, tint) => {
    g.fillStyle = `rgba(${tint},${a})`;
    if (r < 0.9) g.fillRect(x, y, r * 1.6, r * 1.6);           // tiny ones as crisp pixels
    else { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  };

  // Faint glow of the band, then the stars
  const angle = R() * Math.PI, nx = Math.cos(angle), ny = Math.sin(angle), mid = size / 2;
  const across = (x, y) => (x - mid) * -ny + (y - mid) * nx;   // distance from the band's center line
  const bandWidth = size * (0.08 + R() * 0.06);
  g.save();
  g.translate(mid, mid); g.rotate(angle);
  const haze = g.createLinearGradient(0, -bandWidth * 2, 0, bandWidth * 2);
  haze.addColorStop(0, 'rgba(120,130,170,0)');
  haze.addColorStop(0.5, 'rgba(120,130,170,0.045)');
  haze.addColorStop(1, 'rgba(120,130,170,0)');
  g.fillStyle = haze;
  g.fillRect(-size, -bandWidth * 2, size * 2, bandWidth * 4);
  g.restore();

  const area = size * size;
  const count = Math.round(area / 2600);                        // general sky
  for (let i = 0; i < count; i++) {
    const p = R() ** 3;                                         // skewed: mostly small and faint
    star(R() * size, R() * size, 0.35 + p * 1.3, 0.25 + R() * 0.55 + p * 0.2, tints[(R() * tints.length) | 0]);
  }
  const bandCount = Math.round(area / 3200);                    // extra dim stars crowding the band
  for (let i = 0; i < bandCount; i++) {
    const x = R() * size, y = R() * size;
    const d = across(x, y) / bandWidth;
    if (R() > Math.exp(-d * d)) continue;
    star(x, y, 0.3 + R() * 0.45, 0.2 + R() * 0.4, tints[(R() * tints.length) | 0]);
  }
  const bright = Math.max(6, Math.round(area / 180000));        // a handful of bright stars with halos
  for (let i = 0; i < bright; i++) {
    const x = R() * size, y = R() * size, r = 1.1 + R() * 1.1, tint = tints[(R() * tints.length) | 0];
    const glow = g.createRadialGradient(x, y, 0, x, y, r * 6);
    glow.addColorStop(0, `rgba(${tint},0.35)`);
    glow.addColorStop(1, `rgba(${tint},0)`);
    g.fillStyle = glow;
    g.beginPath(); g.arc(x, y, r * 6, 0, Math.PI * 2); g.fill();
    star(x, y, r, 1, tint);
  }
  return c;
}

function starsFx() {
  const fit = () => {
    if (!skyCanvas || parseFloat(skyCanvas.style.width) < skySize()) skyCanvas = drawSky(skySize());
    if (!skyCanvas.isConnected) stage.replaceChildren(skyCanvas);
  };
  fit();
  // If the window grows past the screen size (e.g. an external display), draw a bigger sky
  addEventListener('resize', fit);
  return () => removeEventListener('resize', fit);
}

// ---- Animated effects ----
// Each effect gets a canvas filling the window and a frame(dt, t, w, h) call per animation frame,
// in CSS pixels. The browser pauses frames while the tab is hidden; with reduced motion, one still frame.
const R = Math.random;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

function canvasFx(make, lowRes) {
  const c = Object.assign(document.createElement('canvas'), { className: 'fx' });
  const g = c.getContext('2d');
  const fx = make(g, c);
  let w, h, raf, last = performance.now();
  const size = () => {
    w = innerWidth; h = innerHeight;
    const s = lowRes ? lowRes / w : Math.min(devicePixelRatio || 1, 2);
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    g.setTransform(s, 0, 0, s, 0, 0);
    fx.resize?.(w, h);
    if (still) fx.frame(0, 0, w, h);
  };
  const tick = now => {
    fx.frame(Math.min((now - last) / 1000, 0.05), now / 1000, w, h);
    last = now;
    if (!still) raf = requestAnimationFrame(tick);
  };
  size();
  addEventListener('resize', size);
  stage.replaceChildren(c);
  raf = requestAnimationFrame(tick);
  return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); };
}

const vGradient = (g, h, ...stops) => {
  const grad = g.createLinearGradient(0, 0, 0, h);
  stops.forEach((col, i) => grad.addColorStop(i / (stops.length - 1), col));
  return grad;
};

// Snow: soft flakes at different depths; nearer ones are bigger, brighter and faster, all swaying
function snowFx(g) {
  let flakes = [], bg;
  const flake = (w, h, anywhere) => {
    const d = R() ** 2;   // mostly distant flakes
    return { d, x: R() * w, y: anywhere ? R() * h : -5, r: 0.8 + d * 3.2, v: 14 + d * 50, a: 0.35 + d * 0.6,
             amp: 8 + d * 22, sw: 0.4 + R() * 0.8, ph: R() * 6.3 };
  };
  return {
    resize(w, h) {
      bg = vGradient(g, h, '#0c121d', '#1a2331');
      flakes = Array.from({ length: Math.round(w * h / 2800) }, () => flake(w, h, true));
    },
    frame(dt, t, w, h) {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      for (const f of flakes) {
        f.y += f.v * dt;
        const x = f.x + Math.sin(t * f.sw + f.ph) * f.amp + t * 6 * f.d;   // sway plus a light breeze
        if (f.y > h + 5) Object.assign(f, flake(w, h, false));
        g.fillStyle = `rgba(235,242,255,${f.a})`;
        g.beginPath(); g.arc(((x % (w + 10)) + w + 10) % (w + 10) - 5, f.y, f.r, 0, 6.283); g.fill();
      }
    },
  };
}

// Rain: thin slanted streaks at different depths, small ripples where near drops land, mist at the bottom
function rainFx(g) {
  let drops = [], ripples = [], bg, mist;
  const WIND = -0.12;   // horizontal slant per unit of fall
  const drop = (w, h, anywhere) => {
    const d = R();
    return { d, x: R() * (w + h * 0.15), y: anywhere ? R() * h : -40 - R() * 60, len: 7 + d * 17, v: 260 + d * 340,
             a: 0.07 + d * 0.28, lw: 0.6 + d * 0.9, land: h * (0.86 + R() * 0.14) };
  };
  return {
    resize(w, h) {
      bg = vGradient(g, h, '#080b10', '#0f151d', '#151d27');
      mist = g.createLinearGradient(0, h * 0.7, 0, h);
      mist.addColorStop(0, 'rgba(120,140,160,0)'); mist.addColorStop(1, 'rgba(120,140,160,0.08)');
      drops = Array.from({ length: Math.round(w * h / 3500) }, () => drop(w, h, true));
      ripples = [];
    },
    frame(dt, t, w, h) {
      g.fillStyle = bg; g.fillRect(0, 0, w, h);
      g.lineCap = 'round';
      for (const p of drops) {
        p.y += p.v * dt; p.x += p.v * WIND * dt;
        if (p.d > 0.7 && p.y > p.land) {   // near drops splash on the "ground"
          ripples.push({ x: p.x, y: p.land, age: 0, a: p.a * 1.6 });
          Object.assign(p, drop(w, h, false));
        } else if (p.y - p.len > h) Object.assign(p, drop(w, h, false));
        g.strokeStyle = `rgba(175,200,225,${p.a})`; g.lineWidth = p.lw;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.len * WIND, p.y - p.len); g.stroke();
      }
      g.lineWidth = 0.8;
      ripples = ripples.filter(r => (r.age += dt) < 0.45);
      for (const r of ripples) {
        const k = r.age / 0.45;
        g.strokeStyle = `rgba(175,200,225,${r.a * (1 - k)})`;
        g.beginPath(); g.ellipse(r.x, r.y, 2 + k * 9, 0.6 + k * 2, 0, 0, 6.283); g.stroke();
      }
      g.fillStyle = mist; g.fillRect(0, h * 0.7, w, h * 0.3);
    },
  };
}

// Lava lamp: metaballs drifting up and down, merging into pools at the bottom and top.
// The field is computed on a small canvas and stretched to the window, which keeps it cheap and soft.
function lavaFx(g, c) {
  const blobs = Array.from({ length: 7 }, (_, i) => ({
    x: 0.15 + (i / 6) * 0.7 + (R() - 0.5) * 0.08, r: 0.055 + R() * 0.05,
    period: 28 + R() * 34, ph: R() * 6.3, ph2: R() * 6.3,
  }));
  const BG_TOP = [24, 6, 40], BG_BOT = [58, 8, 38], LAVA_TOP = [255, 70, 125], LAVA_BOT = [255, 165, 55];
  let img;
  return {
    resize() { img = g.createImageData(c.width, c.height); },
    frame(dt, t) {
      const W = c.width, H = c.height, data = img.data, diag = Math.hypot(W, H);
      const pos = blobs.map(b => ({
        x: (b.x + 0.05 * Math.sin(t * 6.283 / (b.period * 1.7) + b.ph2)) * W,
        y: (0.5 + 0.47 * Math.sin(t * 6.283 / b.period + b.ph)) * H,
        rr: (b.r * diag) ** 2,
      }));
      for (let y = 0, i = 0; y < H; y++) {
        const fy = y / (H - 1);
        const pool = 1.15 * fy ** 10 + 0.8 * (1 - fy) ** 14;   // wax pooled at the bottom, a little at the top
        for (let x = 0; x < W; x++, i += 4) {
          let f = pool;
          for (const p of pos) { const dx = x - p.x, dy = y - p.y; f += p.rr / (dx * dx + dy * dy + 1); }
          const a = Math.min(1, Math.max(0, (f - 0.92) / 0.16));   // soft edge around the threshold
          const glow = Math.min(1, f) ** 3 * 0.22;                   // warm haze around each blob
          for (let k = 0; k < 3; k++) {
            const bgc = BG_TOP[k] + (BG_BOT[k] - BG_TOP[k]) * fy, lava = LAVA_TOP[k] + (LAVA_BOT[k] - LAVA_TOP[k]) * fy;
            data[i + k] = bgc + (lava - bgc) * Math.max(a, glow);
          }
          data[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
    },
  };
}

// Synthwave: striped sunset sun behind mountains, with a glowing grid rolling toward you.
// The sky, sun and mountains are drawn once per resize; only the grid is redrawn each frame.
function synthFx(g, c) {
  let sky, hz;
  const GROUND = '#120024';
  return {
    resize(w, h) {
      hz = Math.round(h * 0.58);
      sky = document.createElement('canvas');
      sky.width = c.width; sky.height = c.height;
      const s = sky.getContext('2d');
      s.setTransform(c.width / w, 0, 0, c.height / h, 0, 0);
      const air = vGradient(s, hz, '#07000f', '#1d0636', '#5a0f5c', '#b21f6a');
      s.fillStyle = air; s.fillRect(0, 0, w, hz);
      for (let i = 0, n = w * hz / 2500; i < n; i++) {   // a few stars, fading toward the horizon
        const y = R() ** 1.6 * hz * 0.75;
        s.fillStyle = `rgba(255,255,255,${(0.2 + R() * 0.6) * (1 - y / (hz * 0.75))})`;
        s.fillRect(R() * w, y, R() < 0.9 ? 1 : 2, 1);
      }
      const sr = Math.min(w, h) * 0.2, sx = w / 2, sy = hz - sr * 0.3;
      const halo = s.createRadialGradient(sx, sy, sr * 0.6, sx, sy, sr * 2.4);
      halo.addColorStop(0, 'rgba(255,60,150,0.35)'); halo.addColorStop(1, 'rgba(255,60,150,0)');
      s.fillStyle = halo; s.fillRect(0, 0, w, hz);
      const sun = s.createLinearGradient(0, sy - sr, 0, sy + sr);
      sun.addColorStop(0, '#ffe46b'); sun.addColorStop(0.55, '#ff8a4c'); sun.addColorStop(1, '#ff2f8e');
      s.fillStyle = sun; s.beginPath(); s.arc(sx, sy, sr, 0, 6.283); s.fill();
      s.fillStyle = air;   // slice the lower half of the sun with bands of sky
      for (let i = 0; i < 7; i++) s.fillRect(sx - sr, sy + sr * (0.08 + i * 0.13), sr * 2, 1.5 + i * 1.5);
      for (const [shade, height, rough] of [['#2a0b44', 0.13, 0.9], ['#17062a', 0.08, 0.6]]) {   // two mountain ridges
        s.fillStyle = shade; s.beginPath(); s.moveTo(0, hz);
        let y = 0.5;
        for (let x = 0; x <= w + 20; x += 18) {
          y = Math.min(1, Math.max(0.1, y + (R() - 0.5) * rough));
          const edge = 0.25 + 0.75 * Math.min(1, Math.abs(x / w - 0.5) * 2.6);   // lower in the middle, around the sun
          s.lineTo(x, hz - y * edge * h * height);
        }
        s.lineTo(w, hz); s.closePath(); s.fill();
      }
      s.fillStyle = vGradient(s, h - hz, GROUND, '#05000c');
      s.translate(0, hz);
      s.fillRect(0, 0, w, h - hz);
    },
    frame(dt, t, w, h) {
      g.drawImage(sky, 0, 0, w, h);
      const depth = h - hz, cx = w / 2, gap = w / 9, shift = (t * 0.55) % 1;
      g.beginPath();
      for (let X = -40; X <= 40; X++) { g.moveTo(cx, hz); g.lineTo(cx + X * gap * 1.6, h + depth * 0.6 * 1.6); }
      for (let i = 1; i < 60; i++) {
        const z = i - shift;
        if (z < 0.5) continue;
        const y = hz + depth / z;
        if (y > h + 2) continue;
        g.moveTo(0, y); g.lineTo(w, y);
      }
      g.lineCap = 'butt';
      g.strokeStyle = 'rgba(255,46,151,0.22)'; g.lineWidth = 4; g.stroke();   // glow
      g.strokeStyle = '#ff4fa8'; g.lineWidth = 1.3; g.stroke();
      const fade = g.createLinearGradient(0, hz, 0, hz + depth * 0.45);       // lines melt into the horizon haze
      fade.addColorStop(0, GROUND); fade.addColorStop(1, 'rgba(18,0,36,0)');
      g.fillStyle = fade; g.fillRect(0, hz, w, depth * 0.45);
      g.fillStyle = 'rgba(255,90,170,0.55)'; g.fillRect(0, hz - 1, w, 1.5);   // bright horizon line
    },
  };
}

const FX = {
  stars: { name: 'Starfield', start: starsFx },
  snow:  { name: 'Snow',      start: () => canvasFx(snowFx) },
  rain:  { name: 'Rain',      start: () => canvasFx(rainFx) },
  lava:  { name: 'Lava lamp', start: () => canvasFx(lavaFx, 200) },
  synth: { name: 'Synthwave', start: () => canvasFx(synthFx) },
};
let fxName = 'stars';
try { if (FX[localStorage.getItem('fx')]) fxName = localStorage.getItem('fx'); } catch {}

const markChips = active => document.querySelectorAll('#fxChips .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.fx === active));

// Shows the chosen effect in place of any video (videoEngine stops whatever is on the stage)
function showFx(name = fxName) {
  videoEngine?.();
  fxName = name;
  try { localStorage.setItem('fx', name); } catch {}
  videoEngine = FX[name].start();
  markChips(name);
  $('videoStatus').textContent = 'Showing: ' + FX[name].name;
}

for (const [key, fx] of Object.entries(FX)) {
  const b = Object.assign(document.createElement('button'), { className: 'chip', textContent: fx.name });
  b.dataset.fx = key;
  b.onclick = () => showFx(key);
  $('fxChips').append(b);
}

// ---- Video ----
function embedUrl(url) {
  let m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1&loop=1&playlist=${m[1]}&controls=0&playsinline=1&modestbranding=1`;
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return `https://player.vimeo.com/video/${m[1]}?background=1&autoplay=1&muted=1&loop=1`;
  return null;
}

function loadVideo() {
  const url = $('videoUrl').value.trim();
  if (!url) return;
  videoEngine?.(); videoEngine = null;
  const embed = embedUrl(url);
  if (embed) {
    const f = document.createElement('iframe');
    f.src = embed;
    f.allow = 'autoplay; fullscreen';
    // YouTube rejects embeds without a referrer (error 153), so override the page's no-referrer here
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    stage.replaceChildren(f);
    markChips(null);
    $('videoStatus').textContent = 'Embedded player loaded';
    return;
  }
  // Muted so it never competes with the audio stream
  const v = Object.assign(document.createElement('video'), { muted: true, loop: true, autoplay: true, playsInline: true });
  v.addEventListener('playing', () => $('videoStatus').textContent = 'Playing (muted)');
  v.addEventListener('error', () => {
    if (!v.isConnected) return;  // replaced by another video meanwhile
    showFx();
    $('videoStatus').textContent = 'Couldn’t play that video';
    toast('Couldn’t play that video, back to ' + FX[fxName].name.toLowerCase());
  });
  stage.replaceChildren(v);
  markChips(null);
  videoEngine = attach(v, url);
  v.play().catch(() => {});
  $('videoStatus').textContent = 'Loading…';
}
$('videoLoad').onclick = loadVideo;
$('videoUrl').onkeydown = e => { if (e.key === 'Enter') loadVideo(); };
showFx();

// ---- Favorites (stored in this browser, for http://localhost:8080) ----
const DEFAULT_FAVS = {
  audio: [
    { name: 'SomaFM Drone Zone', url: 'https://somafm.com/dronezone130.pls' },
    { name: 'SomaFM Deep Space One', url: 'https://somafm.com/deepspaceone130.pls' },
    { name: 'SomaFM Groove Salad', url: 'https://somafm.com/groovesalad130.pls' },
    { name: 'SomaFM ThistleRadio', url: 'https://somafm.com/thistle130.pls' },
    { name: 'Radio Paradise', url: 'https://stream.radioparadise.com/aac-128' },
  ],
  video: [
    { name: 'Fireplace (3 h)', url: 'https://archive.org/download/TheBestFireplaceVideo3HoursHD/The%20Best%20Fireplace%20Video%20(3%20hours)%20HD.mp4' },
    { name: 'Kaleidoscope (2 h)', url: 'https://archive.org/download/kaleidoscopevideo/Skope%202hr-HD.mp4' },
    { name: 'Lava lamp (1 h)', url: 'https://archive.org/download/Lavalamp_201601/vape%20blue%201hr.mp4' },
    { name: 'Aurora (13 min)', url: 'https://archive.org/download/the-aurora_201602/the-aurora.mp4' },
    { name: 'Earth from the ISS', url: 'https://archive.org/download/ISSVideoResourceEarthViews720p/ISS%20Video%20Resource_Earth_Views_720p.mp4' },
    { name: 'Northern lights, Iceland (4K loop)', url: 'https://commons.wikimedia.org/wiki/Special:FilePath/002_Northern_lights_in_the_night_sky_over_M%C3%BDvatn_in_Iceland_Video_by_Giles_Laurent.webm' },
  ],
};

function loadFavs(kind) {
  try { return JSON.parse(localStorage.getItem('favs-' + kind)) ?? DEFAULT_FAVS[kind]; }
  catch { return DEFAULT_FAVS[kind]; }
}
function saveFavs(kind, list) {
  try { localStorage.setItem('favs-' + kind, JSON.stringify(list)); } catch {}
  renderFavs(kind);
}
function renderFavs(kind) {
  $(kind + 'Favs').replaceChildren(...loadFavs(kind).map(f => listItem(f.name, null, () => {
    $(kind + 'Url').value = f.url;
    $(kind + 'Url').dispatchEvent(new Event('change'));
    setPanel(null);
    kind === 'audio' ? playAudio() : loadVideo();
  }, iconButton('x', 'Remove ' + f.name, () => saveFavs(kind, loadFavs(kind).filter(x => x.url !== f.url)), 'x'))));
}
for (const kind of ['audio', 'video']) {
  $(kind + 'Save').onclick = () => {
    const url = $(kind + 'Url').value.trim();
    if (!url) return toast('Enter a URL first');
    const guess = decodeURIComponent(url.split(/[?#]/)[0].split('/').filter(Boolean).pop() || url);
    const name = prompt('Name this favorite:', guess)?.trim();
    if (!name) return;
    // Saving an existing URL renames it in place
    const list = loadFavs(kind);
    const existing = list.find(f => f.url === url);
    saveFavs(kind, existing ? list.map(f => f === existing ? { name, url } : f) : [...list, { name, url }]);
  };
  renderFavs(kind);
}

// ---- Fullscreen (the whole player, so the dock still works) ----
function toggleFullscreen() {
  if (document.fullscreenElement) return document.exitFullscreen();
  document.documentElement.requestFullscreen?.().catch(() => toast('Full screen isn’t allowed here'));
}
$('fullscreen').onclick = toggleFullscreen;
stage.ondblclick = toggleFullscreen;
document.addEventListener('fullscreenchange', () => {
  setIcon($('fullscreen'), document.fullscreenElement ? 'shrink' : 'expand');
  $('fullscreen').title = document.fullscreenElement ? 'Exit full screen (F)' : 'Full screen (F)';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openPanel) setPanel(null);
  if (e.key.toLowerCase() === 'f' && !e.target.closest('input') && !e.metaKey && !e.ctrlKey) toggleFullscreen();
});
</script>
